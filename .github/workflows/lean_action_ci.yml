name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # Read access to repository contents

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Mathlib's compiled files take most of the runner's disk; remove preinstalled toolchains
      # that the build does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      # `lake build` builds only the modules of lean4-phylogenetics that this repository imports;
      # the audit reads all of them (lean4-phylogenetics, docs/CONVENTIONS.md, Section 3).
      - name: Build the library that the audit reads
        run: lake build Phylogenetics
      # The audit sees a module's proofs only through its own `import all` line: every module of
      # Allman2011/ (Basic/, External/ and the paper's library), the paper's Solution in palomar/,
      # but not the Challenge, and every module of Phylogenetics.
      - name: Check that the audit imports every module of the libraries
        run: |
          diff <({ find Allman2011 -name '*.lean'; cd palomar && find . -name Solution.lean; } \
            | sed 's#^\./##; s/\.lean$//; s#/#.#g' | sort) \
            <(grep -E '^import all Allman2011\.' scripts/Audit.lean | sed 's/^import all //' | sort)
          diff <(cd .lake/packages/Phylogenetics && find Phylogenetics -name '*.lean' \
            | sed 's/\.lean$//; s#/#.#g' | sort) \
            <(grep -E '^import all Phylogenetics\.' scripts/Audit.lean | sed 's/^import all //' | sort)
      - name: Audit axioms and dependencies
        run: lake env lean scripts/Audit.lean
      # The routes of the paper's proofs (docs/Allman2011/paper_routes.tsv, from route_check.py
      # extract) and the reviewed differences (docs/Allman2011/route_differences.tsv); see the
      # skill's SKILL.md, "Faithful proofs".
      - name: Check that the proofs follow the routes of the paper's proofs
        run: >-
          python3 scripts/route_check.py check docs/Allman2011/paper_routes.tsv
          --accept docs/Allman2011/route_differences.tsv
      # The copy of Allman2011/Defs.lean in palomar/Allman2011/Challenge.lean.
      - name: Check that the Challenge's copy of the shared definitions is current
        run: python3 scripts/sync_challenge_defs.py --check
      - name: Check that the documentation's links to the code are current
        run: python3 scripts/linkify_docs.py --check
      - name: Check the Markdown tables
        run: >-
          python3 scripts/check_md_tables.py README.md
          docs/Allman2011/REPORT.md docs/Allman2011/CREDITS.md
          Allman2011/Basic/README.md Allman2011/External/README.md Allman2011/External/*/README.md
